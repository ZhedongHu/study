<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>给心怀热爱的人准备的惊喜</title>
  <meta name="description" content="一份微不足道的薄礼" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23006874'/%3E%3Cpath d='M24 13l11 5-11 5-11-5 11-5zM14 23l10 4.5V33l-10-4.5V23zm20 0v5.5L24 33v-5.5l10-4.5z' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- 顶部应用栏 -->
  <header class="app-bar" role="banner">
    <button class="icon-btn" id="menuBtn" aria-label="打开导航" title="菜单">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
    </button>
    <a class="app-bar__title" href="#/" aria-label="返回首页">学习中心</a>
    <div class="app-bar__spacer"></div>
    <button class="icon-btn" id="searchBtn" aria-label="搜索" title="搜索">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5 1.5-1.5-5-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" aria-label="切换主题" title="切换明暗主题">
      <svg id="themeIcon" viewBox="0 0 24 24" aria-hidden="true"></svg>
    </button>
  </header>

  <div class="layout">
    <!-- 左侧导航抽屉 -->
    <aside class="nav-drawer" id="navDrawer" aria-label="课程导航">
      <div class="nav-drawer__head">
        <div class="nav-drawer__brand">课程目录</div>
        <button class="icon-btn nav-drawer__close" id="navClose" aria-label="关闭导航" title="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <nav class="nav-tree" id="navTree" aria-label="课时列表"><!-- JS 渲染 --></nav>
    </aside>
    <div class="scrim" id="scrim"></div>

    <!-- 主内容区 -->
    <main class="content" id="content" tabindex="-1"><!-- JS 渲染 --></main>

    <!-- 右侧页内目录 -->
    <aside class="toc" id="toc" aria-label="本页目录"><!-- JS 渲染 --></aside>
  </div>

  <!-- 搜索面板 -->
  <div class="search-panel" id="searchPanel" hidden>
    <div class="search-panel__scrim" id="searchScrim"></div>
    <div class="search-panel__box" role="dialog" aria-modal="true" aria-label="搜索课程">
      <div class="search-panel__field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5 1.5-1.5-5-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
        <input type="search" id="searchInput" placeholder="搜索课程、单元或课时…" autocomplete="off" />
        <button class="icon-btn" id="searchClose" aria-label="关闭搜索" title="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div class="search-panel__results" id="searchResults"></div>
    </div>
  </div>

  <!-- 轻提示 -->
  <div class="snackbar" id="snackbar" hidden></div>

  <script src="js/highlight.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
